apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: collabspace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: collabspace/server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: CLIENT_URL
              value: "http://localhost:3000"
            - name: NODE_ENV
              value: "production"
          envFrom:
            - secretRef:
                name: collabspace-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: collabspace
spec:
  type: LoadBalancer
  selector:
    app: server
  ports:
    - port: 4000
      targetPort: 4000
