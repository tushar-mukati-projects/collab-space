services:
  server:
    build: ./server
    ports:
      - "4000:4000"
    env_file: ./server/.env
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_COLLAB_URL: ${NEXT_PUBLIC_COLLAB_URL:-ws://localhost:4000/collab}
    ports:
      - "3000:3000"
    environment:
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    depends_on:
      - server
    restart: unless-stopped

  stripe-cli:
    image: stripe/stripe-cli:latest
    command: listen --forward-to http://server:4000/api/billing/webhook --api-key ${STRIPE_SECRET_KEY}
    depends_on:
      - server
    environment:
      - STRIPE_API_KEY=${STRIPE_SECRET_KEY}
    restart: unless-stopped
